name: KalenderSpike
options:
  bundleIdPrefix: se.housemates
  deploymentTarget:
    iOS: "17.0"
targets:
  KalenderSpike:
    type: application
    platform: iOS
    sources: [KalenderSpike]
    info:
      path: KalenderSpike/Info.plist
      properties:
        CFBundleDisplayName: KalenderSpike
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: HouseMates visar och skapar händelser i er gemensamma kalender.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: se.housemates.kalenderspike
            CFBundleURLSchemes: [kalenderspike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.housemates.kalenderspike
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
