name: HouseMates
options:
  bundleIdPrefix: se.housemates
  developmentLanguage: sv
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Appen och delningstillägget måste ha samma version; räkna upp byggnumret inför varje uppladdning.
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  HouseMates:
    type: application
    platform: iOS
    sources: [HouseMates, Shared]
    dependencies:
      - package: Supabase
      - target: HouseMatesShare
    entitlements:
      path: HouseMates/HouseMates.entitlements
      properties:
        com.apple.security.application-groups: [group.se.housemates.app]
        # Xcode byter till production vid uppladdning till TestFlight och App Store.
        aps-environment: development
    scheme:
      testTargets: [HouseMatesTests]
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Release.xcconfig
    preBuildScripts:
      - name: Stoppa ofärdigt release-bygge
        basedOnDependencyAnalysis: false
        inputFiles: [$(SRCROOT)/HouseMates/integritetspolicy.md]
        script: |
          # Ett bygge för TestFlight och App Store får inte peka på den lokala databasen
          # eller visa platshållare i integritetspolicyn.
          [ "$CONFIGURATION" = "Release" ] || exit 0
          case "$SUPABASE_URL" in https://*) ;; *) echo "error: Fyll i SUPABASE_URL (https) i Config/Release.xcconfig"; exit 1 ;; esac
          [ -n "$SUPABASE_KEY" ] || { echo "error: Fyll i SUPABASE_KEY i Config/Release.xcconfig"; exit 1; }
          [ -n "$SUPPORT_EMAIL" ] || { echo "error: Fyll i SUPPORT_EMAIL i Config/Release.xcconfig"; exit 1; }
          if grep -q -e '\[NAMN\]' -e '\[E-POST\]' "$SRCROOT/HouseMates/integritetspolicy.md"; then
            echo "error: Byt [NAMN] och [E-POST] i HouseMates/integritetspolicy.md"; exit 1
          fi
    info:
      path: HouseMates/Info.plist
      properties:
        CFBundleDisplayName: HouseMates
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
        SupportEmail: $(SUPPORT_EMAIL)
        CFBundleURLTypes:
          - CFBundleURLName: se.housemates.app
            CFBundleURLSchemes: [housemates]
        NSCalendarsFullAccessUsageDescription: HouseMates visar och skapar händelser i den kalender ni väljer att dela. Andra kalendrar används inte.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.housemates.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  HouseMatesShare:
    type: app-extension
    platform: iOS
    sources: [HouseMatesShare, Shared]
    entitlements:
      path: HouseMatesShare/HouseMatesShare.entitlements
      properties:
        com.apple.security.application-groups: [group.se.housemates.app]
    info:
      path: HouseMatesShare/Info.plist
      properties:
        CFBundleDisplayName: HouseMates
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.housemates.app.share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  HouseMatesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HouseMatesTests]
    dependencies:
      - target: HouseMates
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
